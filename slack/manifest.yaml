# Slack app manifest for AI Trends Scout.
# Use it at https://api.slack.com/apps -> "Create New App" -> "From a manifest".
# Socket Mode is enabled, so no public URL is needed (see docs/SLACK_SETUP.md).
display_information:
  name: AI Trends Scout
  description: Finds the newest AI/LLM models, frameworks and releases.
  long_description: >-
    AI Trends Scout researches the latest developments in AI and LLMs: new models from frontier
    labs (OpenAI, Anthropic, Google DeepMind, Meta, Mistral, xAI, DeepSeek, Qwen and more), agent
    and LLM framework releases, trending open-weight models and notable papers. Mention the bot,
    send it a direct message, or use the /ai-trends command. Answers include dated items and
    source links.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: ai-trends-scout
    always_online: true
  slash_commands:
    - command: /ai-trends
      description: Ask about the latest AI/LLM models, frameworks and releases
      usage_hint: "[what's new in AI this week?]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read # receive @mentions in channels
      - chat:write # post and update answers
      - commands # the /ai-trends slash command
      - im:history # receive direct messages
      - im:read # know which conversations are DMs
      - im:write # reply in DMs
      - reactions:write # 👀 / ✅ status reactions on the question
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
