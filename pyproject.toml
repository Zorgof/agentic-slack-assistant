[project]
name = "trends-agent"
version = "0.1.0"
description = "Agentic Slack assistant that researches the newest AI/LLM trends (OpenAI Agents SDK + Slack Bolt)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "cachetools>=7.2.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai-agents>=0.22.3",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.30.0",
    "slack-sdk>=3.44.1",
    "structlog>=26.1.0",
    "trafilatura>=2.2.0",
]

[project.scripts]
trends-agent = "trends_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trends_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trends_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-cachetools>=7.0.0.20260713",
    "types-pyyaml>=6.0.12.20260906",
]
